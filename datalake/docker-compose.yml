# Variáveis do S3 (floci) usadas pelo app e pelo explorador.
x-ambiente-s3: &ambiente-s3
  AWS_ENDPOINT_URL: http://floci:4566
  AWS_S3_BUCKET: solarvision-datalake
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: us-east-1

services:
  floci:
    image: floci/floci:latest
    container_name: floci-solarvision
    ports:
      - "4566:4566"

  app:
    build: .
    image: solarvision-datalake-app
    working_dir: /projeto
    # SUPABASE_URL e SUPABASE_SERVICE_KEY do coletor (coletor/coletar_supabase.py); opcional, fora do git
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/projeto
      # exportar_bi.py e exportar_mapa_calor.py gravam aqui o BI e o mapa de calor que o app lê (fora do git)
      - ../frontend/public/bi:/projeto/app-bi
      # só leitura: tests/site confere os data-heat do app contra o contrato (como o tests/site do professor)
      - ../frontend/src:/projeto/app-src:ro
    environment: *ambiente-s3
    depends_on:
      - floci

  explorador:
    image: solarvision-datalake-app
    working_dir: /projeto
    volumes:
      - .:/projeto
      # exportar_bi.py grava aqui o mapa de calor e o BI que o app lê (frontend/public/bi, fora do git)
      - ../frontend/public/bi:/projeto/app-bi
    environment:
      <<: *ambiente-s3
      # as etapas numeradas e os workflows ficam juntos em workflows/ (os jobs de verdade, em pipeline/)
      EXPLORADOR_JOBS: workflows
    command: streamlit run explorador/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false --client.showErrorDetails none
    ports:
      - "8501:8501"
    depends_on:
      - floci
