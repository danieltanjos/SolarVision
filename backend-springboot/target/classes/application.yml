server:
  port: 8081

spring:
  application:
    name: solarvision-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/solarvision}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  graphql:
    graphiql:
      enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:U29sYXJWaXNpb25TdXBlclNlY3JldEtleVNvbGFyVmlzaW9uU3VwZXJTZWNyZXRLZXk=}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
  internal:
    token: ${INTERNAL_API_TOKEN:solarvision-internal-token}
