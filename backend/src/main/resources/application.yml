server:
  port: 8081

spring:
  application:
    name: solarvision-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/solarvision_db}
    username: ${DB_USER:solarvision_user}
    password: ${DB_PASSWORD:solarvision_password}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  jackson:
    time-zone: UTC
  graphql:
    path: /api/graphql
  grpc:
    server:
      port: ${GRPC_SERVER_PORT:9090}
    client:
      channels:
        local:
          address: ${GRPC_LOCAL_ADDRESS:localhost:9090}

app:
  jwt:
    secret: ${JWT_SECRET:U29sYXJWaXNpb25TdXBlclNlY3JldEtleVNvbGFyVmlzaW9uU3VwZXJTZWNyZXRLZXk=}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
  dashboard:
    zone-id: ${APP_DASHBOARD_ZONE_ID:America/Sao_Paulo}
