services:
  postgres:
    image: postgres:17-alpine
    container_name: solarvision-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: solarvision_db
      POSTGRES_USER: solarvision_user
      POSTGRES_PASSWORD: solarvision_password
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solarvision_user -d solarvision_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - solarvision-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: solarvision-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/solarvision_db
      DB_USER: solarvision_user
      DB_PASSWORD: solarvision_password
      JWT_SECRET: U29sYXJWaXNpb25TdXBlclNlY3JldEtleVNvbGFyVmlzaW9uU3VwZXJTZWNyZXRLZXk=
      JWT_EXPIRATION_SECONDS: 86400
      INTERNAL_API_TOKEN: solarvision-internal-token
      TZ: America/Sao_Paulo
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - solarvision-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: solarvision-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - solarvision-net

  seed-data:
    build:
      context: ./backend/data-seeder
      dockerfile: Dockerfile
    container_name: solarvision-seed
    restart: "no"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: solarvision_db
      DB_USER: solarvision_user
      DB_PASSWORD: solarvision_password
      TZ: America/Sao_Paulo
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - solarvision-net

networks:
  solarvision-net:
    driver: bridge

volumes:
  postgres_data:
