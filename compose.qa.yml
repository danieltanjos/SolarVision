name: solarvision-qa
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: solarvision_qa
      POSTGRES_USER: solarvision_qa
      POSTGRES_PASSWORD: qa-local-only
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U solarvision_qa -d solarvision_qa"]
      interval: 3s
      retries: 30
    volumes:
      - qa-data:/var/lib/postgresql/data
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/solarvision_qa
      DB_USER: solarvision_qa
      DB_PASSWORD: qa-local-only
      JWT_SECRET: U29sYXJWaXNpb25TdXBlclNlY3JldEtleVNvbGFyVmlzaW9uU3VwZXJTZWNyZXRLZXk=
    ports:
      - "127.0.0.1:18081:8081"
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build: ./frontend
    volumes:
      - ./frontend/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:80"
    depends_on: [backend]
  backend-tests:
    image: maven:3.9.11-eclipse-temurin-25
    profiles: [test]
    working_dir: /app
    volumes:
      - ./backend:/app
      - qa-maven:/root/.m2
    command: [mvn, -B, clean, verify]
volumes:
  qa-data:
  qa-maven:
